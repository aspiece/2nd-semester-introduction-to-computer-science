<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} | {{ site.title | escape }}</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
body{margin:0;background:#fff;color:#1f2937;line-height:1.6}
header{background:#173b77;color:white;padding:16px 20px}
header a{color:white;text-decoration:none;font-weight:700}
nav.quick{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
nav.quick a{font-size:14px;text-decoration:underline}
main{max-width:860px;margin:auto;padding:24px 18px 90px}
h1{line-height:1.25}
a{color:#1d4ed8}
pre{white-space:pre-wrap;overflow:auto;background:#f1f5f9;padding:14px}
.quiz .q{border:1px solid #cbd5e1;padding:14px;margin:16px 0;border-radius:8px}
.quiz ul{list-style:none;padding:0}
.quiz li{margin:6px 0}
.quiz-opt{display:block;width:100%;text-align:left;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#1f2937}
.quiz-opt.right{background:#dcfce7}.quiz-opt.wrong{background:#fee2e2}
.pager{display:flex;justify-content:space-between;margin-top:32px}
#py-editor{position:fixed;bottom:12px;left:12px;z-index:40;max-width:calc(100vw - 24px)}
.py-toggle{background:#1d4ed8;color:white;border:0;border-radius:30px;padding:12px 16px}
.py-panel{position:absolute;bottom:48px;left:0;background:white;border:1px solid #94a3b8;border-radius:10px;width:min(720px,calc(100vw - 24px));padding:12px;box-shadow:0 5px 24px #0003}
.py-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.py-monaco{height:260px}.py-output{height:110px;overflow:auto;background:#0f172a;color:white;padding:10px}
.py-note{font-size:12px}.inline-monaco{min-height:100px}.inline-py{border:1px solid #cbd5e1;padding:8px}
@media print{#py-editor{display:none}}
</style>
</head>
<body>
<header><a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
<nav class="quick" aria-label="Student navigation"><a href="{{ '/student/' | relative_url }}">All student lessons</a><a href="{{ page.teacher_url | relative_url }}">Teacher version</a></nav>
</header>
<main id="content">
<article id="article"><h1>{{ page.title }}</h1>{{ content }}</article>
<nav class="pager" id="pager" aria-label="Lesson navigation">
{% if page.prev_url %}<a href="{{ page.prev_url | relative_url }}">Previous: {{ page.prev_title }}</a>{% endif %}
{% if page.next_url %}<a href="{{ page.next_url | relative_url }}">Next: {{ page.next_title }}</a>{% endif %}
</nav>
</main>
<div id="py-editor" data-base="{{ site.baseurl }}">
<button id="py-toggle" class="py-toggle" aria-expanded="false" aria-controls="py-panel">▶ Python editor</button>
<section id="py-panel" class="py-panel" aria-label="Python editor" hidden>
<div class="py-bar"><strong>main.py</strong><span id="py-status" role="status">Not loaded</span><button id="py-run">Run ▶</button><button id="py-reset">Reset</button><button id="py-clear">Clear output</button></div>
<div id="py-monaco" class="py-monaco"></div><pre id="py-output" class="py-output" aria-live="polite"></pre>
<p class="py-note">Python runs in your browser. Code is saved on this device.</p>
</section></div>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/editor.js' | relative_url }}" defer></script>
</body></html>

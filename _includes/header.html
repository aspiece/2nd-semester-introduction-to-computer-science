<header class="topbar">
  <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
  <a class="brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
  <form class="search" role="search" action="{{ site.baseurl }}/search/" method="get">
    <input type="search" name="q" id="search-box" placeholder="Search lessons  ( / )" aria-label="Search this site" autocomplete="off">
    <ul class="search-suggest" id="search-suggest" hidden></ul>
  </form>
  <nav class="topnav" aria-label="Main">
    {% for link in site.data.navigation %}<a href="{{ site.baseurl }}/{{ link.url }}">{{ link.title }}</a>{% endfor %}
    <a href="{{ site.repo }}" rel="noopener">GitHub</a>
    <a class="view-toggle" id="view-toggle" href="{{ '/student/' | relative_url }}">Switch to student view</a>
  </nav>
  <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
</header>

name: New lesson checklist

on:
  pull_request:
    paths:
      - "_docs/lesson_plans/units/*/*_lesson/lesson.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find added lessons
        id: lessons
        run: |
          git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^_docs/lesson_plans/units/[0-9]+_unit/[0-9]+_lesson/lesson\.md$' > added.txt || true
          cat added.txt
      - name: Build checklist
        if: hashFiles('added.txt') != ''
        run: |
          {
            echo "<!-- new-lesson-checklist -->"
            echo "### New lesson detected"
            echo "Because the student pages, syllabus and sidebar are edited by hand, please update these for each new lesson:"
            while read -r f; do
              [ -z "$f" ] && continue
              unit=$(echo "$f" | sed -E 's#.*/([0-9]+)_unit/([0-9]+)_lesson/.*#\1#')
              lesson=$(echo "$f" | sed -E 's#.*/([0-9]+)_unit/([0-9]+)_lesson/.*#\2#')
              echo
              echo "**Unit $unit, lesson $lesson** (\`$f\`)"
              echo "- [ ] Add \`student/$unit.$lesson.md\` (permalink \`/student/$unit.$lesson/\`, with \`teacher_url\`, \`prev_url\`, \`next_url\`). Leave out instructor notes, pacing, prep, accommodations and slide decks."
              echo "- [ ] Update \`prev_url\` / \`next_url\` on the neighbouring student pages"
              echo "- [ ] Add the lesson to \`_data/toc.yml\` and \`_docs/SUMMARY.md\`"
              echo "- [ ] Link it from \`student/index.md\`"
              echo "- [ ] Update the pacing in \`pages/syllabus.md\` and any new terms in \`pages/glossary.md\`"
              echo "- [ ] Keep solutions out of the repo (they stay on the TEALS Dashboard)"
            done < added.txt
          } > comment.md
      - name: Post or update comment
        if: hashFiles('comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq '[.[] | select(.body | contains("<!-- new-lesson-checklist -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body-file comment.md
          fi
